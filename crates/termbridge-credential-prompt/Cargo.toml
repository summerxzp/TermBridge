[package]
name = "termbridge-credential-prompt"
version = "0.0.1"
edition = "2021"
publish = false

# ADR-0009 阶段 B1：独立 helper process，Windows native 凭据对话框。
# 不依赖 termbridge 主 crate，仅通过 stdin/stdout JSON IPC 通信。
[[bin]]
name = "termbridge-credential-prompt"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
