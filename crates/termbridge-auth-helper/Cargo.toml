[package]
name = "termbridge-auth-helper"
version = "0.0.1"
edition = "2021"
publish = false

# ADR-0009 阶段 B1：独立 helper process，Windows native 凭据对话框。
# 不依赖 termbridge 主 crate，仅通过 stdin/stdout JSON IPC 通信。
# ADR-0014 §4.3：从 termbridge-credential-prompt 改名为 termbridge-auth-helper（去 Windows 绑定感）。
[[bin]]
name = "termbridge-auth-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux / macOS：/dev/tty + termios 控制 ECHO，弹出系统级密码输入。
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
