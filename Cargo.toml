# Phase 3-A W2：agentd + cli 作为 workspace 成员（远端 daemon + 测试 client，仅 Linux 编译）
[workspace]
members = ["agentd", "cli", "crates/termbridge-auth-helper", "gui/src-tauri"]

[workspace.package]
version = "0.2.0"

[package]
name = "termbridge"
version.workspace = true
edition = "2021"
publish = false

[lib]
name = "termbridge"
path = "src/lib.rs"

[[bin]]
name = "termbridge-mcp"
path = "src/main.rs"

[[bin]]
name = "termbridge"
path = "src/bin/termbridge.rs"

# Phase 0 原型用 examples/ 验证各 crate，不污染主二进制
[[example]]
name = "p0_echo_mcp"
path = "examples/p0_echo_mcp.rs"

[[example]]
name = "p0_ssh_pty"
path = "examples/p0_ssh_pty.rs"

[[example]]
name = "p0_ssh_config"
path = "examples/p0_ssh_config.rs"

[[example]]
name = "p0_sftp"
path = "examples/p0_sftp.rs"

[dependencies]
# MCP（Phase 0-A 验证 rmcp 3.1.1）
rmcp = { version = "3.1", features = ["server", "macros", "transport-io", "schemars"] }

# SSH / SFTP
# russh 默认用 aws-lc-rs（需 NASM），Windows 无 NASM → 切 ring（纯 Rust）
# 保留 flate2（压缩）+ rsa（RSA 主机密钥兼容）+ async-trait（Handler trait）
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa", "async-trait"] }
russh-sftp = "2.4"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化 / Schema
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 工具
bytes = "1"
async-trait = "0.1"
# Phase 3-A W3：daemon protocol 的 data 字段是 base64 编码（send_input 编码 / pty_data 解码）
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
# 人类管理员 CLI（src/bin/termbridge.rs）：raw mode + 终端 resize
crossterm = "0.28"
regex = "1"
parking_lot = "0.12"
# 并发 HashMap（Phase 1：多 session 并发读写，替代 Mutex<HashMap>）
dashmap = "6"
# Phase 5 / ADR-0009：CredentialProvider Secret 自动清零
zeroize = { version = "1", features = ["alloc"] }

# ADR-0017：Host Policy 配置文件（~/.config/termbridge/hosts.toml）平台路径与 TOML 解析
dirs = "6"
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
