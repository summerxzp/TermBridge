[package]
name = "termbridge-agentd"
version.workspace = true
edition = "2021"
publish = false

[[bin]]
name = "termbridge-agentd"
path = "src/main.rs"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
anyhow = "1"
thiserror = "2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 工具
bytes = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
parking_lot = "0.12"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"

# Linux-only 依赖：nix（PTY / fork / setsid / signal）
# 非 Linux 平台 agentd 编译会失败，这是预期行为（agentd 仅跑 Linux，见 ADR-0004 §10 W2）
[target.'cfg(target_os="linux")'.dependencies]
nix = { version = "0.29", features = ["fs", "process", "signal", "user", "term"] }
