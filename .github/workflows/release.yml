name: Release

# 触发：推送 v* tag 时构建 release 资产并上传到 GitHub Release
#
# 发布矩阵（3 个主控包 + 1 个内嵌 runtime 组件）：
#   windows-x86_64  (windows-latest,  MSVC)
#   linux-x86_64    (ubuntu-latest,   GNU)
#   macos-arm64     (macos-latest,    Apple Silicon 原生)
#
# agentd (Linux x86_64 远端 daemon) 单独构建一次，嵌入所有主控包的
# resources/agentd/linux-x86_64/，由 bootstrap_host 自动部署到远端，
# 用户无需单独下载（参考 docs/internal/打包建议.md §推荐模型）
#
# 打包格式：Windows .zip，其他 .tar.gz；每个 archive 配 .sha256
# macOS Intel (x86_64) 暂不发布：Intel Mac 用户可通过 Rosetta 2 运行 arm64 包
# 的主控端（agentd 只跑远端 Linux，不影响）

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # agentd 是 Linux-only 远端 daemon（依赖 nix crate），只能在 Linux runner 上构建
  # 构建一次后作为 artifact 分发给 3 个主控 build job 嵌入
  build-agentd:
    name: Build agentd (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-agentd

      - name: Build agentd
        run: cargo build --release -p termbridge-agentd

      - name: Upload agentd artifact
        uses: actions/upload-artifact@v5
        with:
          name: agentd-linux-x86_64
          path: target/release/termbridge-agentd

  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    needs: build-agentd
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - asset: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - asset: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Download agentd artifact
        uses: actions/download-artifact@v5
        with:
          name: agentd-linux-x86_64
          path: agentd-artifact

      - name: Build main binaries
        run: cargo build --release --target ${{ matrix.target }} --bin termbridge-mcp --bin termbridge

      - name: Build auth helper
        run: cargo build --release --target ${{ matrix.target }} -p termbridge-auth-helper

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "${{ matrix.asset }}"
          $dir = "termbridge-$asset"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/termbridge-mcp.exe" "$dir/"
          Copy-Item "target/${{ matrix.target }}/release/termbridge.exe" "$dir/"
          Copy-Item "target/${{ matrix.target }}/release/termbridge-auth-helper.exe" "$dir/"
          Copy-Item "packaging/mcp-config.json" "$dir/"
          Copy-Item "skills/termbridge/SKILL.md" "$dir/"
          Copy-Item "packaging/README.txt" "$dir/"
          # 嵌入 agentd（Linux 远端 runtime 组件，由 bootstrap_host 自动部署）
          New-Item -ItemType Directory -Path "$dir/resources/agentd/linux-x86_64" -Force | Out-Null
          Copy-Item "agentd-artifact/termbridge-agentd" "$dir/resources/agentd/linux-x86_64/"
          # 扁平归档：Windows zip 与 Unix tar 层级一致，解压即得全部文件
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"
          $hash = (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $dir.zip" | Out-File "$dir.zip.sha256"

      - name: Stage artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="${{ matrix.asset }}"
          dir="termbridge-$asset"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/termbridge-mcp" "$dir/"
          cp "target/${{ matrix.target }}/release/termbridge" "$dir/"
          cp "target/${{ matrix.target }}/release/termbridge-auth-helper" "$dir/"
          cp "packaging/mcp-config.json" "$dir/"
          cp "skills/termbridge/SKILL.md" "$dir/"
          cp "packaging/README.txt" "$dir/"
          # 嵌入 agentd（Linux 远端 runtime 组件，由 bootstrap_host 自动部署）
          mkdir -p "$dir/resources/agentd/linux-x86_64"
          cp "agentd-artifact/termbridge-agentd" "$dir/resources/agentd/linux-x86_64/"
          # 扁平归档（-C "$dir" .）：与 Windows zip 解压层级一致，解压即得全部文件
          tar czf "$dir.tar.gz" -C "$dir" .
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: |
            *.zip
            *.tar.gz
            *.sha256

  release:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release-files/ \;

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true

  # npm 平台包（长期主渠道，参考 packaging/npm-platform/）：
  # - 从同一 staging 生成 3 个平台包（@summerxzp/termbridge-<os>-<arch>，完整 release 目录）
  #   与薄主包 @summerxzp/termbridge-mcp，版本取 tag（与 Cargo 一致）
  # - 发布走 npm Trusted Publishing（OIDC）：npmjs.com 上各包已配置
  #   summerxzp/TermBridge release.yml 为受信发布者（账号级，无需 NPM_TOKEN secret）
  npm-packages:
    name: npm platform packages (OIDC trusted publishing)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # OIDC trusted publishing 要求 Node >= 22.14 / npm >= 11.5.1（npmjs docs），
          # 用 Node 24 与 ci.yml 对齐，同时规避 Node 20 deprecation 警告
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify version consistency (tag vs Cargo.toml)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # 版本一致性门禁：npm 包版本（取自 tag）必须与二进制自报版本
          # （Cargo.toml [workspace.package].version）一致，防止 tag 与 Cargo 版本
          # 分叉后把错位版本发布到 npm（更新检查 / 日志自报版本都会错位）
          CARGO_VERSION=$(awk '/^\[workspace\.package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && $1 == "version" {gsub(/[",]/, "", $3); print $3; exit}' Cargo.toml)
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::未能从 Cargo.toml [workspace.package] 解析 version"
            exit 1
          fi
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::版本不一致：tag ${GITHUB_REF_NAME} → npm 版本 ${VERSION}，但 Cargo.toml [workspace.package].version = ${CARGO_VERSION}。请对齐版本后重新打 tag。"
            exit 1
          fi
          echo "版本一致：${VERSION}"

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Stage platform dirs from release assets
        shell: bash
        run: |
          set -euo pipefail
          # win32-x64  linux-x64  darwin-arm64 → asset 名
          declare -A ASSETS=( [win32-x64]=windows-x86_64 [linux-x64]=linux-x86_64 [darwin-arm64]=macos-arm64 )
          mkdir -p staging
          for key in win32-x64 linux-x64 darwin-arm64; do
            d="staging/$key"
            mkdir -p "$d"
            archive=$(find artifacts -type f \( -name "termbridge-${ASSETS[$key]}.zip" -o -name "termbridge-${ASSETS[$key]}.tar.gz" \) | head -1)
            [ -n "$archive" ] || { echo "missing asset for $key"; exit 1; }
            case "$archive" in
              *.zip)    unzip -q "$archive" -d "$d" ;;
              *.tar.gz) tar xzf "$archive" -C "$d" ;;
            esac
            # 归档为扁平结构（Windows zip: Compress-Archive -Path "$dir/*"；
            # Unix: tar -C "$dir" .），解压即得全部文件，无顶层目录，无需整理
          done

      - name: Generate platform packages + sync main package version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node packaging/npm-platform/scripts/build-platform-packages.mjs \
            --version "$VERSION" \
            --os-arch win32-x64  --staging staging/win32-x64 \
            --os-arch linux-x64  --staging staging/linux-x64 \
            --os-arch darwin-arm64 --staging staging/darwin-arm64

      - name: Pack validation (always)
        shell: bash
        run: |
          set -euo pipefail
          for p in packaging/npm-platform/generated/termbridge-win32-x64 \
                   packaging/npm-platform/generated/termbridge-linux-x64 \
                   packaging/npm-platform/generated/termbridge-darwin-arm64; do
            ( cd "$p" && npm pack --dry-run )
          done
          ( cd packaging/npm-platform && npm pack --dry-run )

      - name: Publish to npm (OIDC trusted publishing)
        shell: bash
        run: |
          set -euo pipefail
          # OIDC：npm CLI 检测到 GitHub Actions OIDC 环境后自动换取短时身份，
          # 无需 NODE_AUTH_TOKEN（npm trust publisher 已在 npmjs.com 配置）。
          # --access public：scope 包（@summerxzp/*）默认 restricted，必须显式公开
          #
          # 版本已存在 → 跳过该包继续（v0.3.1 实测教训：新包名首发必须手动
          # publish 一次才能配 trusted publisher，手动版与 CI 版同版本号冲突；
          # unpublish 最后一个版本会触发 24h 禁止重发，比跳过更糟。手动版与
          # CI 产物同源同内容，仅缺 provenance，功能无差异）。
          publish_one() {
            local pkg_dir="$1"
            # 输出落文件（tee 的退出码恒 0，管道会吞掉 npm 的失败状态）。
            # 必须 cd 进包目录发布：在仓库根 `npm publish <dir>` 会把目录
            # 路径当 git spec 解析（v0.3.1 第四次实测：git ls-remote
            # ssh://git@github.com/packaging/npm-platform.git → publickey 拒绝）
            if ! ( cd "$pkg_dir" && npm publish --access public ) > /tmp/npm-publish.log 2>&1; then
              # 版本已存在（手动首发残留 / 历史事故残留）：跳过该包继续。
              # grep -i + 单复数通配：实测错误消息是
              # "Cannot publish over previously published version"（v0.3.2
              # 实测：旧模式 'cannot publish over the previously published
              # versions' 大小写/单复数都不匹配，导致 win32 残留 0.3.2 撞车
              # 时 job 直接失败，后续三个包未发布）
              if grep -qiE "cannot publish over (the )?previously published versions?|EPUBLISHCONFLICT" /tmp/npm-publish.log; then
                echo "::warning::$pkg_dir 该版本已存在（历史残留/手动首发），跳过"
                cat /tmp/npm-publish.log
                return 0
              fi
              cat /tmp/npm-publish.log
              return 1
            fi
            cat /tmp/npm-publish.log
          }
          for p in packaging/npm-platform/generated/termbridge-win32-x64 \
                   packaging/npm-platform/generated/termbridge-linux-x64 \
                   packaging/npm-platform/generated/termbridge-darwin-arm64; do
            publish_one "$p"
          done
          publish_one packaging/npm-platform
