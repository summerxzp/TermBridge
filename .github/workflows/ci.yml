name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build frontend (for Tauri asset embedding)
        working-directory: gui
        run: |
          npm ci
          npm run build

      - name: Check main binaries (termbridge-mcp, termbridge)
        run: cargo check -p termbridge --all-targets

      - name: Check auth helper
        run: cargo check -p termbridge-auth-helper

      - name: Check agentd (Linux only)
        if: runner.os == 'Linux'
        run: cargo check -p termbridge-agentd

      - name: Check GUI (Tauri)
        run: cargo check -p termbridge-gui

      - name: Run unit tests
        run: cargo test --lib
