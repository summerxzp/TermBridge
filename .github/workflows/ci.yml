name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      # ADR-0020：Windows 发布产物用静态 CRT，CI 同参数 check 防漂移
      - name: Configure static CRT (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build frontend (for Tauri asset embedding)
        working-directory: gui
        run: |
          npm ci
          npm run build

      - name: Check main binaries (termbridge-mcp, termbridge)
        run: cargo check -p termbridge --all-targets

      - name: Check auth helper
        run: cargo check -p termbridge-auth-helper

      # ADR-0019：helper 协议 v2 / 级联分类 / 超时测试（含 stub 集成测试，
      # 需要 script(1) 提供 PTY —— Ubuntu runner 自带）
      - name: Test auth helper (Linux only)
        if: runner.os == 'Linux'
        run: cargo test -p termbridge-auth-helper

      - name: Check agentd (Linux only)
        if: runner.os == 'Linux'
        run: cargo check -p termbridge-agentd

      - name: Test agentd (Linux only)
        if: runner.os == 'Linux'
        run: cargo test -p termbridge-agentd

      # ── ADR-0020：musl 静态构建验证（Linux 发布产物线）──────────────
      # 发布产物是 musl 静态（agentd + 主控三件套），CI 必须在 musl target
      # 上跑同样的 check + 测试，防止「gnu 过了 musl 挂了」的发布事故
      - name: Install musl toolchain (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check musl targets (Linux only)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo check --target x86_64-unknown-linux-musl -p termbridge --bins --bin termbridge-mcp --bin termbridge -p termbridge-auth-helper -p termbridge-agentd

      - name: Test agentd on musl (Linux only)
        if: runner.os == 'Linux'
        run: cargo test --target x86_64-unknown-linux-musl -p termbridge-agentd

      - name: Test auth helper on musl (Linux only)
        if: runner.os == 'Linux'
        run: cargo test --target x86_64-unknown-linux-musl -p termbridge-auth-helper

      - name: Check GUI (Tauri)
        run: cargo check -p termbridge-gui

      - name: Run unit tests
        run: cargo test --lib -p termbridge
